name: Deploy SvelteKit to GitHub Pages

on:
  push:
    branches: svelteKit  # Change to your default branch if different
  workflow_dispatch:
  repository_dispatch:
    types: [nightly-release]

permissions: {}

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Update nightly release metadata
        if: github.event_name == 'repository_dispatch'
        env:
          RELEASE_VERSION: ${{ github.event.client_payload.version }}
          RELEASE_BUILD: ${{ github.event.client_payload.build }}
          RELEASE_TAG: ${{ github.event.client_payload.tag }}
        run: node update-nightly-release.mjs "$RELEASE_VERSION" "$RELEASE_BUILD" "$RELEASE_TAG"

      - name: Commit nightly release metadata
        if: github.event_name == 'repository_dispatch'
        env:
          RELEASE_VERSION: ${{ github.event.client_payload.version }}
          RELEASE_BUILD: ${{ github.event.client_payload.build }}
        run: |
          if git diff --quiet -- src/lib/config/nightly.json; then
            echo "Nightly release metadata is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/config/nightly.json
          git commit -m "Update nightly download to v${RELEASE_VERSION} NB ${RELEASE_BUILD}"
          git push origin HEAD:svelteKit

      - name: Install dependencies
        run: npm ci

      - name: Build the SvelteKit site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5